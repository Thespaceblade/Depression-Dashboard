name: Auto Update Sports Data

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    # Also run when teams_config.json or fetch script changes
    paths:
      - 'scripts/fetch_all_data.py'
      - 'src/sports_api.py'
      - 'src/espn_client.py'
      - 'src/upcoming_schedule.py'
      - 'src/recent_games.py'
      - '.github/workflows/auto-update-data.yml'
    branches:
      - main

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight deps (what Vercel uses)
          pip install -r requirements.txt
          # Heavy fetch-only deps (CI only, not on Vercel)
          pip install fastf1 nba_api sportsipy espn-api
      
      - name: Ensure teams_config.json exists
        run: |
          if [ ! -f teams_config.json ]; then
            echo "Creating default teams_config.json..."
            cat > teams_config.json << 'EOF'
          {
            "teams": [],
            "f1_driver": {
              "name": "Max Verstappen",
              "sport": "F1",
              "championship_position": 1,
              "expected_performance": 10,
              "jasons_expectations": 10,
              "recent_races": [],
              "recent_dnfs": 0,
              "rivals": ["Lewis Hamilton", "Charles Leclerc", "Lando Norris"],
              "notes": "Huge fan - Red Bull dominance"
            },
            "fantasy_team": {
              "name": "Jason's Fantasy Squad",
              "record": {
                "wins": 0,
                "losses": 0
              },
              "expected_performance": 7,
              "jasons_expectations": 8,
              "recent_streak": []
            }
          }
          EOF
          fi
      
      - name: Fetch latest sports data
        run: |
          python scripts/fetch_all_data.py || exit 1
          # Verify file was created/updated
          if [ ! -f teams_config.json ]; then
            echo "❌ ERROR: teams_config.json was not created by fetch_all_data.py"
            exit 1
          fi
          echo "✅ teams_config.json exists after fetch"
      
      - name: Check if data files were updated
        id: check-file
        run: |
          git update-index --no-assume-unchanged teams_config.json 2>/dev/null || true
          git update-index --no-skip-worktree teams_config.json 2>/dev/null || true
          if [ ! -f teams_config.json ]; then
            echo "file_exists=false" >> $GITHUB_OUTPUT
            echo "file_changed=false" >> $GITHUB_OUTPUT
            echo "❌ teams_config.json not found after fetch!"
            exit 1
          fi
          echo "file_exists=true" >> $GITHUB_OUTPUT
          echo "---- teams_config / upcoming / recent snapshot diff (first 80 lines) ----"
          git --no-pager diff -- teams_config.json src/data/teams_config.json src/data/upcoming_events.json src/data/recent_games.json | head -80 || true
          if git diff --quiet -- teams_config.json src/data/teams_config.json src/data/upcoming_events.json src/data/recent_games.json; then
            echo "file_changed=false" >> $GITHUB_OUTPUT
          else
            echo "file_changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit changes
        if: steps.check-file.outputs.file_changed == 'true'
        run: |
          git config --local user.email "jason.charwin360@gmail.com"
          git config --local user.name "Thespaceblade"
          git add -f teams_config.json src/data/teams_config.json
          git add src/data/upcoming_events.json src/data/recent_games.json || true
          if ! git diff --staged --quiet; then
            # Commit first, then rebase/push — pull --rebase fails with a dirty index.
            git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin main || git pull origin main || true
            git push origin main
          else
            echo "No changes to commit"
          fi
      
      - name: No changes to commit
        if: steps.check-file.outputs.file_changed == 'false'
        run: |
          echo "✅ Sports data files are up to date - no changes to commit"
